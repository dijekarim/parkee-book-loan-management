version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: book_loan_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rails Backend API
  backend:
    build: ./backend
    command: /bin/sh -c "bundle install && rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0 -p 4000"
    volumes:
      - ./backend:/app
      - gem_cache:/usr/local/bundle
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_NAME=book_loan_development
      - RAILS_ENV=development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vue.js Frontend (Development)
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
  gem_cache:
  node_modules: